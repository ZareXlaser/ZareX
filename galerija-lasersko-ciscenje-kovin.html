<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#0f2748;
  color:white;
  overflow-x:hidden;
}

/* ================= HEADER (TVOJ, NEDIRAN) ================= */
header{
  position:sticky;top:0;width:100%;
  z-index:1100;background:#0f2748;
  padding:12px 28px;
  box-shadow:0 2px 6px rgba(0,0,0,0.3)
}
.header-inner{
  max-width:1400px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between
}
.logo{height:80px}
.nav-links{display:flex;gap:18px;align-items:center}
.nav-links a{
  color:white;text-decoration:none;
  font-weight:600;font-size:1.2em
}
.cta-btn{
  background:white;color:#193a65 !important;
  padding:10px 20px;border-radius:10px;
  font-weight:bold;text-decoration:none
}
.social-icons{display:flex;gap:15px;font-size:1.4em}
.social-icons a{color:white}

/* HAMBURGER */
.hamburger{
  display:none;
  font-size:2em;
  color:white;
  cursor:pointer;
}

/* MOBILE MENU */
.mobile-menu{
  display:none;
  position:fixed;
  top:90px;
  left:0;
  width:100%;
  background:#0f2748;
  padding:22px;
  text-align:center;
  gap:18px;
  flex-direction:column;
  z-index:1099;
}
.mobile-menu a{
  color:white;
  text-decoration:none;
  font-size:1.35em;
  font-weight:600;
}
.cta-mobile{
  background:white;
  color:#193a65 !important;
  padding:14px 30px;
  border-radius:12px;
  font-weight:bold;
  margin-top:10px;
}

/* MOBILE AKTIVACIJA */
@media (max-width: 900px) {
  .nav-links { display: none; }
  .hamburger { display: block; }
}

/* ================= TITLE ================= */
h1{text-align:center;padding:25px 0;font-size:2em}

/* ================= SECTION ================= */
.section{
  padding:20px;
  display:flex;
  justify-content:center;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

/* ================= FOLDERS ================= */
.folder-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:25px;
  max-width:1200px;
  margin:0 auto;
  padding:20px;
}

.folder{
  background:#244c88;
  border-radius:12px;
  padding:10px;
  cursor:pointer;
  transition:0.3s;
  text-align:center;
}
.folder:hover{
  background:#305da5;
  transform:scale(1.05);
}

/* ✅ KOCKICE */
.folder img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
}

.folder-name{
  margin-top:10px;
  font-weight:bold;
}

/* ================= CONTENT ================= */
.folder-content{display:none;margin-top:25px}
.folder-content.active{display:block}

/* ================= MEDIA GRID ================= */
.media-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:15px;
  max-width:1000px;
  margin:0 auto 40px auto;
}

.media-grid img,
.media-grid video{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:10px;
  border:2px solid white;
  cursor:pointer;
  transition:0.3s;
}

.media-grid img:hover,
.media-grid video:hover{
  transform:scale(1.05);
}

/* ================= LIGHTBOX ================= */
.lightbox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
  z-index:5000;
}
.lightbox.active{display:flex}

.lightbox-content{
  position:relative;
  max-width:95%;
  max-height:95%;
}
.lightbox-content img,
.lightbox-content video{
  max-width:100%;
  max-height:85vh;
  object-fit:contain;
  border-radius:10px;
}
.lightbox-close{
  position:absolute;
  top:12px;
  right:12px;
  font-size:2.2em;
  color:white;
  z-index:6000;
}

.lightbox-prev,
.lightbox-next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:3em;
  cursor:pointer;
}
.lightbox-prev{left:-60px}
.lightbox-next{right:-60px}

/* ================= MOBILE ================= */
@media(max-width:768px){
  .folder-grid{grid-template-columns:repeat(2,1fr)}
  .media-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .lightbox-prev{left:10px}
  .lightbox-next{right:10px}
  .lightbox-close{top:10px;right:10px}
}

/* ================= FOOTER ================= */
footer{
  text-align:center;
  padding:15px;
  background:#193a65;
  color:white;
  margin-top:60px;
}

/* MOBILE AKTIVACIJA */
@media (max-width: 900px) {

}
.header-inner{

  }

  }

  }
}

</style>

<script>
const folders=document.querySelectorAll('.folder');
const contents=document.querySelectorAll('.folder-content');

folders.forEach(f=>{
  f.addEventListener('click',()=>{
    contents.forEach(c=>c.classList.remove('active'));
    document.getElementById(f.dataset.target).classList.add('active');
    window.scrollBy({top:200,behavior:'smooth'});
  });
});

const lightbox=document.getElementById('lightbox');
const lbImg=document.getElementById('lightbox-img');
const lbVid=document.getElementById('lightbox-video');
const media=[...document.querySelectorAll('.media-grid img,.media-grid video')];
let index=0;

media.forEach((el,i)=>{
  el.addEventListener('click',()=>{
    index=i;
    if(el.tagName==='IMG'){
      lbVid.style.display='none';
      lbImg.style.display='block';
      lbImg.src=el.src;
    }else{
  lbImg.style.display='none';
  lbVid.style.display='block';
  lbVid.src = el.src;
  lbVid.load();
  lbVid.play().catch(()=>{});
}

    lightbox.classList.add('active');
  });
});

document.querySelector('.lightbox-close').onclick=()=>{
  lbVid.pause();
  lbVid.currentTime = 0;
  lightbox.classList.remove('active');
};
;
document.querySelector('.lightbox-prev').onclick=()=>nav(-1);
document.querySelector('.lightbox-next').onclick=()=>nav(1);

function nav(dir){
  index=(index+dir+media.length)%media.length;
  media[index].click();
}
</script>
