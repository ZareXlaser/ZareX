<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hvala za vaše sporočilo - ŽareX</title>

<style>
body{
  background:#0f2748;
  color:white;
  font-family:'Saira', sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
}
.box{
  background:rgba(255,255,255,0.06);
  padding:40px;
  border-radius:14px;
  text-align:center;
  max-width:500px;
  border:1px solid rgba(255,255,255,0.15);
}
h1{
  font-size:2rem;
  margin-bottom:10px;
}
p{
  font-size:1.1rem;
  opacity:0.9;
}
a{
  display:inline-block;
  margin-top:18px;
  background:white;
  color:#0f2748;
  padding:12px 22px;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
}
a:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px rgba(255,255,255,.7);
}
</style>
</head>

<body>

<div class="box">
  <h1>Hvala za poslano povpraševanje! 🎉</h1>
  <p>Vaše sporočilo smo uspešno prejeli.</p>
  <p>Kontaktirali vas bomo v najkrajšem možnem času.</p>

  <a href="index.html">Nazaj na domov</a>
</div>

</body>
</html>
